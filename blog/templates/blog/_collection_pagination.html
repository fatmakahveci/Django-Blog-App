{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}">← Previous</a>{% else %}<span></span>{% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}">Next →</a>{% else %}<span></span>{% endif %}
</nav>{% endif %}
