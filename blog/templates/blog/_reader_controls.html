<section class="reader-controls" aria-label="Reading preferences" data-reader-controls hidden>
  <div class="reader-control-group"><label for="reading-size">Text size</label><select id="reading-size" data-reading-size><option value="standard">Standard</option><option value="large">Large</option><option value="largest">Extra large</option></select></div>
  <button class="reader-button" type="button" data-focus-toggle aria-pressed="false">Focus mode</button>
  <button class="reader-button" type="button" data-resume-reading hidden>Resume reading</button>
  <div class="listen-controls" data-listen-controls hidden>
    <button class="reader-button" type="button" data-listen>Listen to article</button>
    <button class="reader-button" type="button" data-listen-stop hidden>Stop listening</button>
    <label class="sr-only" for="listen-speed">Playback speed</label><select id="listen-speed" data-listen-speed aria-label="Playback speed"><option value="0.85">0.85× speed</option><option value="1" selected>1× speed</option><option value="1.25">1.25× speed</option><option value="1.5">1.5× speed</option></select>
  </div>
  <span class="listen-status" data-listen-status role="status">Checking for an English voice on this device…</span>
</section>
