name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    env:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Generate isolated test secret
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write("DJANGO_SECRET_KEY=" + secrets.token_urlsafe(64) + "\n")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check Django configuration
        run: python manage.py check
      - name: Check production security settings
        env:
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Audit dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip_audit -r requirements-dev.txt -r requirements-browser.txt --progress-spinner off
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Check static assets
        run: python manage.py collectstatic --noinput --dry-run
      - name: Run tests
        run: python -Wd manage.py test

  browser:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Generate isolated test secret
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write("DJANGO_SECRET_KEY=" + secrets.token_urlsafe(64) + "\n")
          PY
      - name: Install browser dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run browser checks with sample content
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/folio-server.log 2>&1 &
          folio_server_pid=$!
          trap 'kill "$folio_server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2) as response:
                      if response.status == 200:
                          break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise SystemExit('The preview server did not become ready.')
          PY
          python scripts/browser_check.py
